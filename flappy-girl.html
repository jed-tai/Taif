<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3f5f4">
<title>طيّارة صغيرة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@700&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 2D canvas sky; the child's real photographed face flies as a winged bird between mint pipes.
   Committed look: the same calm pastel toy world as قفزة قفزة — near-white sky, mint pipes, warm sand ground,
   big pixel score at the top, panels as centred white sheets. */
[hidden]{display:none!important}
:root{--ink:#4b3a30;--dim:#9a8878;--body:"IBM Plex Sans Arabic",system-ui,sans-serif;--pix:"Silkscreen",ui-monospace,monospace;color-scheme:light}
html,body{height:100%;margin:0}
body{background:#f3f5f4;color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#score{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-family:var(--pix);font-weight:700;font-size:clamp(42px,12vw,58px);color:#4d4d52;letter-spacing:1px;pointer-events:none;line-height:1;text-shadow:0 2px 0 rgba(255,255,255,.75)}
#best{position:fixed;top:calc(78px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:13px;color:var(--dim);pointer-events:none;direction:rtl}
#tip{position:fixed;left:50%;bottom:calc(16% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:15px;color:#555;background:rgba(255,255,255,.78);padding:9px 16px;border-radius:999px;direction:rtl;pointer-events:none;white-space:nowrap;transition:opacity .5s}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,40,55,.45);backdrop-filter:blur(3px);padding:24px 16px;z-index:5;direction:rtl}
.panel{background:#fff;border-radius:20px;max-width:340px;width:100%;padding:26px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.panel h1{margin:0;font-size:38px;font-weight:700}
.panel p{margin:0;color:var(--dim);line-height:1.8;font-size:15px}
.big{font-family:var(--pix);font-weight:700;font-size:64px;line-height:1.1}
.lab{font-size:13px;color:var(--dim)}
.btn{height:54px;border:0;border-radius:14px;background:#6d5445;color:#fff;font-family:var(--body);font-size:18px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid #e0902a;outline-offset:3px}
.btn.sec{background:#f0f0f4;color:var(--ink)}
.warn{color:#c2425a;font-size:13.5px;line-height:1.5;margin:-4px 0 2px;direction:rtl}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shk .38s ease;border-color:#e09aaa!important}
.name{height:48px;border-radius:12px;border:1.5px solid #dcdce4;padding:0 14px;font-family:var(--body);font-size:16px;text-align:center;color:var(--ink);background:#fafafc;direction:rtl}
.name:focus{outline:none;border-color:#3a3a46}
.rank{font-size:15px;color:#e0902a;font-weight:700;min-height:22px}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:min(52vh,420px);overflow-y:auto;text-align:right}
.board li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#f5f5f8;font-size:15px}
.board li.me{background:#fff3e2;outline:1.5px solid #f0b866}
.board .n{width:28px;font-family:var(--pix);font-weight:700;color:var(--dim);text-align:center;flex:none}
.board li:nth-child(1) .n{color:#e0a020}.board li:nth-child(2) .n{color:#9aa0aa}.board li:nth-child(3) .n{color:#c07a45}
.board .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.board .sc{font-family:var(--pix);font-weight:700;font-size:17px}
.empty{color:var(--dim);font-size:14px;padding:12px 0}
#medal{font-size:34px;line-height:1;min-height:0}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="score" hidden>0</div>
<div id="best" hidden></div>
<div id="tip" hidden>انقر لترفرف 🪽</div>

<div class="overlay" id="startO">
  <div class="panel">
    <canvas id="avC" width="300" height="220" style="width:150px;height:110px;margin:0 auto;display:block" aria-hidden="true"></canvas>
    <h1>طيّارة صغيرة</h1>
    <p>انقر على الشاشة لترفرف وترتفع.<br>مرِّر بين الأعمدة الخضراء دون أن تلمسها.<br>كل عمود تتجاوزه = <b>نقطة</b>.<br>وضفائرها تطير مع كل رفرفة.</p>
    <input class="name" id="nameI" maxlength="16" placeholder="اكتب اسمك (مطلوب)" autocomplete="nickname" aria-label="اسمك" required>
    <div class="warn" id="nameWarn" hidden>اكتب اسمك أولاً حتى تدخل لوحة الترتيب</div>
    <button class="btn" id="startB" type="button">ابدأ</button>
    <button class="btn sec lbB" type="button" hidden>🏆 لوحة الترتيب</button>
  </div>
</div>

<div class="overlay" id="overO" hidden>
  <div class="panel">
    <div id="medal"></div>
    <div class="lab">النتيجة</div>
    <div class="big" id="oScore">0</div>
    <div class="lab" id="oBest"></div>
    <div class="rank" id="oRank"></div>
    <input class="name" id="nameO" maxlength="16" placeholder="اكتب اسمك لتدخل الترتيب" aria-label="اسمك" hidden>
    <button class="btn" id="againB" type="button">العب مرة أخرى</button>
    <button class="btn sec lbB" type="button" hidden>🏆 لوحة الترتيب</button>
  </div>
</div>

<div class="overlay" id="lbO" hidden>
  <div class="panel">
    <h1 style="font-size:28px">🏆 لوحة الترتيب</h1>
    <ol class="board" id="board"></ol>
    <button class="btn sec" id="lbClose" type="button">رجوع</button>
  </div>
</div>

let ac=null,master=null;
function A(){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.7;master.connect(ac.destination);
    const a=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');a.playsInline=true;a.play().catch(()=>{})}catch(e){}}
  if(ac&&ac.state!=='running'){try{const r=ac.resume();if(r&&r.catch)r.catch(()=>{})}catch(e){}}}
['pointerdown','touchstart','touchend','mousedown','keydown'].forEach(ev=>
  addEventListener(ev,()=>{if(!ac||ac.state!=='running')A()},{capture:true,passive:true}));
addEventListener('visibilitychange',()=>{if(!document.hidden&&ac&&ac.state!=='running')A()});
function tone(f0,f1,d,v,type='sine',delay=0){if(!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
function noise(d,v,f,q,delay=0){if(!ac)return;const t=ac.currentTime+delay,n=Math.floor(ac.sampleRate*d);
  const b=ac.createBuffer(1,n,ac.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=ac.createBufferSource();s.buffer=b;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q||.8;
  const g=ac.createGain();g.gain.value=v;s.connect(bp).connect(g).connect(master);s.start(t)}
// a chirp is a fast frequency sweep up then down — that is what makes a sound "bird"
function chirp(f0,f1,f2,d,v,delay=0){if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain(),hp=ac.createBiquadFilter();
  hp.type='highpass';hp.frequency.value=900;o.type='sine';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+d*.34);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,f2),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+d*.14);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(hp).connect(g).connect(master);o.start(t);o.stop(t+d+.04)}

const SWING=[{a:0,v:0},{a:0,v:0}];
function swingStep(dt){
  const vy=(state==='play'||state==='dead')?bird.vy:Math.sin(t0*2.1)*26;
  const base=clamp(-vy*.0026,-0.60,1.18)-bird.a*.34;      // trail behind the motion, hang against the tilt
  for(let i=0;i<2;i++){const b=SWING[i],k=i?25:22,d=i?5.4:5.0;
    b.v+=((base-b.a)*k-b.v*d)*dt;b.a=clamp(b.a+b.v*dt,-0.52,1.22)}}
function swingKick(){SWING[0].v+=9.4;SWING[1].v+=8.3}       // the whip when she beats her wings

/* ================= world (virtual units, 640 tall) ================= */
const WH=640,GH=86;                               // play height and ground strip
let W=360,H=640,S=1,DPR=1;
const cv=$('cv'),ctx=cv.getContext('2d');
function resize(){DPR=Math.min(2,devicePixelRatio||1);
  const vw=innerWidth,vh=innerHeight;cv.width=Math.round(vw*DPR);cv.height=Math.round(vh*DPR);
  S=vh/WH;H=WH;W=vw/S;}
addEventListener('resize',resize);resize();

const GRAV=1750,FLAP=-480,BIRD_R=27;
let state='menu',score=0,best=store.get('best',0),t0=0;
let bird={y:WH*.44,vy:0,a:0,flapT:0,wp:0},pipes=[],spd=190,scrollG=0,scrollC=0,shake=0,dieT=0,tweetT=4;
const birdX=()=>Math.max(78,W*.30);

function gapFor(sc){return Math.max(152,205-sc*1.35)}
function speedFor(sc){return 190+Math.min(80,sc*2.2)}

function reset(){score=0;spd=speedFor(0);pipes=[];dieT=0;shake=0;tweetT=3.2;
  bird={y:WH*.44,vy:0,a:0,flapT:0,wp:0};
  let x=W+120;for(let i=0;i<4;i++){pipes.push(mkPipe(x));x+=265}
  $('score').textContent='0';paintBest()}
function mkPipe(x){const g=gapFor(score),top=60+g/2,bot=WH-GH-30-g/2;
  return{x,g,y:rnd(top,Math.max(top,bot)),sc:false}}
function paintBest(){$('best').textContent=best?'أفضل نتيجة: '+best:''}

function flap(){if(state==='menu'||state==='dead')return;
  if(state==='ready'){state='play';$('tip').style.opacity=0;setTimeout(()=>$('tip').hidden=true,500)}
  bird.vy=FLAP;bird.flapT=1;swingKick();SND.flap()}

function die(hitGround){if(state==='dead')return;state='dead';dieT=0;shake=1;SND.hit();
  if(!hitGround)setTimeout(()=>{if(state==='dead')SND.die()},110);
  setTimeout(over,1100)}

function over(){
  const nb=score>best;if(nb){best=score;store.set('best',best);SND.best()}
  $('oScore').textContent=score;$('oBest').textContent='أفضل نتيجة: '+best;
  $('medal').textContent=score>=40?'🏆':score>=25?'🥇':score>=12?'🥈':score>=5?'🥉':'🪽';
  $('oRank').textContent='';$('overO').hidden=false;$('score').hidden=true;$('best').hidden=true;
  LB.submit(score);paintBest()}

/* ================= drawing ================= */
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

// a plump little body for the head to sit on
function body(c,R){
  const g=c.createLinearGradient(0,-R*.2,0,R*1.45);
  g.addColorStop(0,'#fae2b4');g.addColorStop(.5,'#eec481');g.addColorStop(1,'#d59e4c');
  c.fillStyle=g;
  c.beginPath();c.ellipse(-R*.18,R*.64,R*.88,R*.78,-.10,0,7);c.fill();
  c.fillStyle='rgba(255,250,236,.70)';                       // paler breast
  c.beginPath();c.ellipse(-R*.02,R*.82,R*.52,R*.52,-.12,0,7);c.fill();
  c.strokeStyle='rgba(176,122,44,.18)';c.lineWidth=R*.05;    // a hint of folded feathers
  c.beginPath();c.moveTo(-R*.62,R*.52);c.quadraticCurveTo(-R*.42,R*.86,-R*.08,R*1.02);c.stroke()}

// one wing: leading edge sweeps back, trailing edge scalloped into four feathers
function wing(c,R,ang,back){
  c.save();c.translate(-R*.38,R*.26);c.rotate(ang);c.scale(.88,.88);
  const g=c.createLinearGradient(0,-R*.3,-R*1.45,R*.35);
  if(back){g.addColorStop(0,'#dfae63');g.addColorStop(1,'#bf8a3c')}
  else{g.addColorStop(0,'#fbe0ab');g.addColorStop(1,'#eab866')}
  c.fillStyle=g;
  c.beginPath();c.moveTo(0,-R*.06);
  c.bezierCurveTo(-R*.45,-R*.58,-R*1.12,-R*.56,-R*1.46,-R*.06);   // leading edge
  c.quadraticCurveTo(-R*1.22,R*.17,-R*1.03,R*.01);                // feather tips
  c.quadraticCurveTo(-R*.88,R*.29,-R*.68,R*.10);
  c.quadraticCurveTo(-R*.52,R*.35,-R*.33,R*.15);
  c.quadraticCurveTo(-R*.17,R*.33,0,R*.14);
  c.closePath();c.fill();
  c.strokeStyle=back?'rgba(130,88,26,.26)':'rgba(176,122,44,.24)';c.lineWidth=R*.04;
  c.beginPath();c.moveTo(-R*.10,-R*.02);c.quadraticCurveTo(-R*.68,-R*.20,-R*1.22,-R*.02);c.stroke();
  c.restore()}

function tail(c,R,sw){
  c.save();c.translate(-R*.92,R*.56);c.rotate(.18+sw*.20);
  for(const [a,col] of [[-.30,'#d9a455'],[0,'#e8b865'],[.30,'#d9a455']]){
    c.save();c.rotate(a);c.fillStyle=col;
    c.beginPath();c.moveTo(0,-R*.05);c.quadraticCurveTo(-R*.40,-R*.12,-R*.70,R*.0);
    c.quadraticCurveTo(-R*.40,R*.14,0,R*.13);c.closePath();c.fill();c.restore()}
  c.restore()}

function feet(c,R,tuck){
  c.strokeStyle='#e8a355';c.lineWidth=R*.085;c.lineCap='round';c.lineJoin='round';
  const drop=R*(.36-.18*tuck);
  for(const sx of [-.42,-.04]){c.save();c.translate(R*sx,R*1.20);
    c.beginPath();c.moveTo(0,0);c.lineTo(R*.05,drop);c.lineTo(R*.24,drop+R*.03);c.stroke();c.restore()}}

// a little crest, so the smiling face still reads as a bird
function crest(c,R,sw){
  c.save();c.translate(R*.06,-R*1.26);c.rotate(-.10+sw*.14);
  for(const [a,s,col] of [[-.42,.78,'#d9a455'],[0,1,'#e8b865'],[.40,.74,'#d9a455']]){
    c.save();c.rotate(a);c.scale(s,s);c.fillStyle=col;
    c.beginPath();c.moveTo(-R*.07,0);c.quadraticCurveTo(-R*.16,-R*.42,0,-R*.60);
    c.quadraticCurveTo(R*.15,-R*.40,R*.07,0);c.closePath();c.fill();c.restore()}
  c.restore()}

function drawBird(c,R,ang,wp,flapT){
  c.save();c.rotate(ang);
  const sw=Math.sin(wp),amp=.50+.45*flapT;
  crest(c,R,sw);
  tail(c,R,sw);
  wing(c,R,-.10+sw*amp+.34,true);                  // far wing, trailing the near one
  feet(c,R,flapT);
  body(c,R);
  const w=R*1.86,h=w*HEAD_AR,sc=w/HW_,hx=R*.12-w/2,hy=R*.30-h;   // her chin rests on the body
  if(brOK>=2)for(let i=0;i<2;i++){const B=BR[i];          // pigtails sit behind her face
    c.save();c.translate(hx+(B.bx+B.px)*sc,hy+(B.by+B.py)*sc);c.rotate(SWING[i].a);
    c.drawImage(B.img,-B.px*sc,-B.py*sc,B.w*sc,B.h*sc);c.restore()}
  if(headOK){c.drawImage(head,hx,hy,w,h)}
  else{c.fillStyle='#e8c9a8';c.beginPath();c.arc(R*.14,-R*.40,R*.85,0,7);c.fill()}
  wing(c,R,-.18+sw*amp,false);                     // near wing, over the breast
  c.restore()}

function drawAvatar(){const c=$('avC').getContext('2d');c.clearRect(0,0,300,220);
  c.save();c.translate(150,112);drawBird(c,52,-.06,1.1,.4,false);c.restore()}

const CLOUDS=[];for(let i=0;i<7;i++)CLOUDS.push({x:rnd(0,1400),y:rnd(40,WH-GH-130),s:rnd(.6,1.35),o:rnd(.5,.95)});
function cloud(c,x,y,s,o){c.save();c.globalAlpha=o*.62;c.fillStyle='#fff';c.translate(x,y);c.scale(s,s);
  c.beginPath();c.arc(0,0,26,0,7);c.arc(28,6,19,0,7);c.arc(-27,8,17,0,7);c.arc(10,-14,18,0,7);
  c.rect(-27,0,55,24);              // one path, so the overlaps don't double-blend
  c.fill();c.restore()}

function pipe(c,p){const w=78,gy=p.y,g=p.g,capH=26,capW=w+16;
  const body=c.createLinearGradient(p.x,0,p.x+w,0);
  body.addColorStop(0,'#d6ece3');body.addColorStop(.42,'#b9d9cc');body.addColorStop(1,'#95bba9');
  const cap=c.createLinearGradient(p.x-8,0,p.x+w+8,0);
  cap.addColorStop(0,'#cfe7dd');cap.addColorStop(.42,'#aed0c2');cap.addColorStop(1,'#87b09c');
  const topH=gy-g/2,botY=gy+g/2,botH=WH-GH-botY;
  c.fillStyle=body;roundRect(c,p.x,-30,w,topH+30-capH,7);c.fill();
  c.fillStyle=cap;roundRect(c,p.x-8,topH-capH,capW,capH,8);c.fill();
  c.fillStyle=body;roundRect(c,p.x,botY+capH,w,Math.max(0,botH-capH)+30,7);c.fill();
  c.fillStyle=cap;roundRect(c,p.x-8,botY,capW,capH,8);c.fill();
  c.fillStyle='rgba(255,255,255,.45)';c.fillRect(p.x+9,-30,7,topH+30-capH);c.fillRect(p.x+9,botY+capH,7,Math.max(0,botH-capH)+30)}

function ground(c){const y=WH-GH;
  c.fillStyle='#ebe3d6';c.fillRect(0,y,W,GH+20);
  c.fillStyle='#d9ccb9';c.fillRect(0,y,W,5);
  c.fillStyle='#e2d8c6';
  for(let x=-((scrollG)%34);x<W+34;x+=34)c.fillRect(x,y+13,18,5)}

function render(){
  const c=ctx;c.setTransform(DPR*S,0,0,DPR*S,0,0);
  const sky=c.createLinearGradient(0,0,0,WH);sky.addColorStop(0,'#f6f8f7');sky.addColorStop(1,'#e4e9e7');
  c.fillStyle=sky;c.fillRect(0,0,W,WH);
  c.save();
  if(shake>0){const k=shake*5;c.translate(rnd(-k,k),rnd(-k,k))}
  for(const cl of CLOUDS){let x=cl.x-scrollC*.28;x=((x+160)%(W+320))-160;cloud(c,x,cl.y,cl.s,cl.o)}
  for(const p of pipes)pipe(c,p);
  ground(c);
  const bx=birdX();
  c.save();c.translate(bx,bird.y);drawBird(c,BIRD_R,bird.a,bird.wp,bird.flapT);c.restore();
  c.restore()}

/* ================= update ================= */
let last=0;
function step(dt){
  swingStep(dt);
  if(state==='menu'){bird.y=WH*.44+Math.sin(t0*2.1)*9;bird.a=Math.sin(t0*2.1)*.07;bird.wp+=dt*7;bird.flapT=.35;
    scrollC+=dt*22;return}
  if(state==='ready'){bird.y=WH*.44+Math.sin(t0*3.4)*11;bird.a=lerp(bird.a,0,dt*8);bird.wp+=dt*11;bird.flapT=.5;
    scrollC+=dt*40;scrollG+=dt*40;return}

  bird.flapT=Math.max(0,bird.flapT-dt*2.6);
  bird.wp+=dt*(8.5+15*bird.flapT);
  shake=Math.max(0,shake-dt*4);
  tweetT-=dt;if(tweetT<=0){tweetT=rnd(3.6,8.5);if(state==='play')SND.tweet()}

  if(state==='dead'){dieT+=dt;bird.vy+=GRAV*1.1*dt;bird.y+=bird.vy*dt;
    bird.a=Math.min(1.45,bird.a+dt*4.6);
    if(bird.y>WH-GH-BIRD_R*.6){bird.y=WH-GH-BIRD_R*.6;bird.vy=0}
    return}

  // ---- flying ----
  bird.vy+=GRAV*dt;bird.y+=bird.vy*dt;
  const want=clamp(bird.vy/620,-.46,1.25);
  bird.a=lerp(bird.a,want,1-Math.pow(.0009,dt));
  spd=speedFor(score);scrollC+=spd*dt;scrollG+=spd*dt;
  for(const p of pipes)p.x-=spd*dt;
  while(pipes.length&&pipes[0].x<-110)pipes.shift();
  const lastP=pipes[pipes.length-1];
  if(!lastP||lastP.x<W-245)pipes.push(mkPipe(Math.max(W+40,(lastP?lastP.x:W)+265)));

  const bx=birdX(),r=BIRD_R*.74;
  if(bird.y+r>WH-GH){bird.y=WH-GH-r;die(true);return}
  if(bird.y-r<-40){bird.y=-40+r;bird.vy=0}
  for(const p of pipes){
    if(!p.sc&&p.x+78<bx-r){p.sc=true;score++;$('score').textContent=score;SND.point()}
    if(bx+r>p.x&&bx-r<p.x+78){
      const top=p.y-p.g/2,bot=p.y+p.g/2;
      const cy=clamp(bird.y,top,bot);
      if(bird.y-r<top||bird.y+r>bot){
        // precise: nearest point on each rectangle
        const nx=clamp(bx,p.x,p.x+78);
        const hitTop=Math.hypot(bx-nx,bird.y-clamp(bird.y,-999,top))<r;
        const hitBot=Math.hypot(bx-nx,bird.y-clamp(bird.y,bot,9999))<r;
        if(hitTop||hitBot){bird.vy=Math.max(bird.vy,-40);die(false);return}}
      void cy}}
}
function frame(now){const dt=Math.min(.045,(now-(last||now))/1000);last=now;t0+=dt;
  try{step(dt);render()}catch(e){}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* ================= input ================= */
function down(e){if(e.target&&e.target.closest&&e.target.closest('button,input'))return;
  A();if(state==='play'||state==='ready')flap()}
addEventListener('pointerdown',down);
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();A();if(state==='play'||state==='ready')flap()}});

/* ================= flow ================= */
function start(){LB.setName($('startO').hidden?$('nameO').value:$('nameI').value);
  if(!LB.has()){                                   // a name is required to be ranked
    $('startO').hidden=false;$('overO').hidden=true;$('lbO').hidden=true;$('nameWarn').hidden=false;
    const i=$('nameI');i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake');
    try{i.focus()}catch(e){}return}
  $('nameWarn').hidden=true;$('nameI').classList.remove('shake');
  A();reset();state='ready';
  $('startO').hidden=true;$('overO').hidden=true;$('score').hidden=false;$('best').hidden=false;
  $('tip').hidden=false;$('tip').style.opacity=1}
$('nameI').addEventListener('input',()=>{if($('nameI').value.trim()){$('nameWarn').hidden=true;$('nameI').classList.remove('shake')}});
$('nameI').addEventListener('keydown',e=>{if(e.key==='Enter')start()});
$('startB').addEventListener('click',start);
$('againB').addEventListener('click',start);
paintBest();

/* ================= leaderboard (shared db) ================= */
const LB=(()=>{let db=null,uid=null,rows=[],mine=null,canWrite=true,lbState='wait';
  const cleanName=v=>String(v||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,16);
  let myName=cleanName(store.get('name',''));$('nameI').value=myName;
  function setName(v){myName=cleanName(v);store.set('name',myName);$('nameI').value=myName;$('nameO').value=myName}
  $('nameI').addEventListener('change',e=>setName(e.target.value));
  $('nameO').addEventListener('change',e=>{setName(e.target.value);if(myName&&pending!=null){const p=pending;pending=null;submit(p)}});
  let pending=null;
  function render(){const ol=$('board');ol.textContent='';
    if(!rows.length){const li=document.createElement('div');li.className='empty';
      li.textContent=lbState==='on'?'لا أحد في الترتيب بعد… كن الأول!'
        :(lbState==='wait'?'جارٍ الاتصال بلوحة الترتيب…'
          :window.__lbReason==='noconfig'?'لوحة الترتيب غير مفعّلة — أضف إعدادات Firebase في أعلى الملف'
          :'تعذّر الاتصال بلوحة الترتيب — تحقّق من الإنترنت');
      ol.appendChild(li);return}
    rows.slice(0,20).forEach((r,i)=>{const li=document.createElement('li');if(r.id===uid)li.className='me';
      const n=document.createElement('span');n.className='n';n.textContent=i+1;
      const w=document.createElement('span');w.className='who';w.textContent=(cleanName(r.name)||'لاعب')+(r.id===uid?' (أنت)':'');
      const sc=document.createElement('span');sc.className='sc';sc.textContent=Math.max(0,Math.floor(Number(r.score)||0));
      li.append(n,w,sc);ol.appendChild(li)})}
  function rankOf(sc){return rows.filter(r=>(Number(r.score)||0)>sc).length+1}
  async function submit(sc){if(!db||!uid){$('oRank').textContent='';return}if(sc<=0&&!mine){$('oRank').textContent='';return}
    const prev=mine?Number(mine.score)||0:0;
    if(!myName){$('nameO').hidden=false;pending=sc;$('oRank').textContent=sc>prev?'اكتب اسمك لتُسجَّل نتيجتك 👇':'';return}
    $('nameO').hidden=true;
    if(sc<=prev&&mine&&mine.name===myName){$('oRank').textContent='ترتيبك: #'+rankOf(prev);return}
    if(!canWrite){$('oRank').textContent='';return}
    const data={name:myName,score:Math.max(sc,prev),at:Date.now()};
    try{await db.collection('scores').doc(uid).set(data);mine=data;$('oRank').textContent=(sc>prev?'🎉 رقم جديد! ':'')+'ترتيبك: #'+rankOf(data.score)}
    catch(e){if(e&&e.code==='invalid_argument'){canWrite=false;$('oRank').textContent='لوحة الترتيب للعرض فقط في هذا الرابط'}else $('oRank').textContent=''}}
  const off=()=>{lbState='off';render()};
  (async()=>{try{
    const be=await new Promise(res=>{                     // Firebase backend, started at the end of this file
      if(window.__lbBackend!==undefined)return res(window.__lbBackend);
      addEventListener('lb-backend',e=>res(e.detail),{once:true});
      setTimeout(()=>res(null),20000)});
    if(!be)return off();
    const d=be.db,u=be.user;
    uid=await u.id();if(!uid)return off();db=d;lbState='on';
    try{const c=await u.can('data.write');if(c===false)canWrite=false}catch(e){}
    document.querySelectorAll('.lbB').forEach(b=>b.hidden=false);
    db.collection('scores').orderBy('score','desc').limit(100).onSnapshot(snap=>{
      rows=snap.docs.map(doc=>({id:doc.id,...(doc.data()||{})}));mine=rows.find(r=>r.id===uid)||mine;render()},()=>{});
    try{const me=await db.collection('scores').doc(uid).get();if(me.exists)mine=me.data()}catch(e){}
    render();
  }catch(e){off()}})();
  document.querySelectorAll('.lbB').forEach(b=>b.addEventListener('click',()=>{render();$('lbO').hidden=false}));
  $('lbClose').addEventListener('click',()=>$('lbO').hidden=true);
  return{submit,setName,has:()=>!!myName}})();

reset();state='menu';$('score').hidden=true;$('best').hidden=true;drawAvatar();
})();
</script>

<script type="module">
/* إعدادات Firebase موضوعة في أعلى هذا الملف (window.FB_CONFIG) */
const FIREBASE_CONFIG = window.FB_CONFIG || {};
const COLLECTION = "flappy_scores";
const V = "10.12.2";
function done(b){window.__lbBackend=b;dispatchEvent(new CustomEvent('lb-backend',{detail:b}))}
if(!FIREBASE_CONFIG.apiKey||!FIREBASE_CONFIG.projectId){window.__lbReason="noconfig";done(null)}
else{
  try{
    const {initializeApp}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const F=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const {getAuth,signInAnonymously}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const app=initializeApp(FIREBASE_CONFIG);const fs=F.getFirestore(app);
    const cred=await signInAnonymously(getAuth(app));const uid=cred.user.uid;
    const wrap=p=>p.catch(e=>{throw{code:e&&e.code==='permission-denied'?'invalid_argument':(e&&e.code)||'unknown',message:String(e&&e.message||e)}});
    const db={collection:()=>({
      orderBy:(f,dir)=>({limit:n=>({onSnapshot:(next,err)=>F.onSnapshot(F.query(F.collection(fs,COLLECTION),F.orderBy(f,dir),F.limit(n)),s=>next({docs:s.docs.map(x=>({id:x.id,exists:true,data:()=>x.data()}))}),err)})}),
      doc:id=>({get:async()=>{const s=await F.getDoc(F.doc(fs,COLLECTION,id));return{exists:s.exists(),data:()=>s.data()}},set:data=>wrap(F.setDoc(F.doc(fs,COLLECTION,id),data))})})};
    done({db,user:{id:async()=>uid,can:async()=>true}});
  }catch(e){console.warn('Leaderboard disabled:',e);window.__lbReason='failed';done(null)}
}
</script>
