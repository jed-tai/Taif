<title>جدول الاستلامات لعام 1448هـ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#0d1f33;--mut:#64748b;--pri:#0e6e8c;--acc:#b98432;--line:#e2e8f0;--shadow:0 1px 2px rgba(15,34,56,.05),0 10px 28px -8px rgba(15,34,56,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08111c;--card:#111f31;--ink:#eaf1f8;--mut:#91a3b9;--pri:#3fb5d6;--acc:#e0b25a;--line:#22374e;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -8px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#08111c;--card:#111f31;--ink:#eaf1f8;--mut:#91a3b9;--pri:#3fb5d6;--acc:#e0b25a;--line:#22374e;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -8px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 28px}
.top{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 18px}
h1{font-size:20px;font-weight:700;margin:0}
.yr{font-size:12.5px;font-weight:600;color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);background:color-mix(in srgb,var(--acc) 10%,transparent);padding:2px 10px;border-radius:99px}

.hero{position:relative;overflow:hidden;border-radius:22px;color:#fff;box-shadow:var(--shadow);min-height:178px;background:#0a2a40}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#0a1230,#1b2a57)}
.ph{position:absolute;inset:0;background-size:cover;background-position:50% 42%;opacity:0;transition:opacity 1.2s}
.hero.ph-on .orb,.hero.ph-on .stars{display:none}
.stars{position:absolute;inset:0;opacity:0;transition:opacity 1s}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.orb{position:absolute;width:46px;height:46px;border-radius:50%;transform:translate(-50%,-50%);transition:left 1s,top 1s}
.orb.sun{background:radial-gradient(circle,#fff6d0 0,#ffd36a 55%,rgba(255,200,90,0) 72%);box-shadow:0 0 40px 14px rgba(255,205,100,.45)}
.orb.moon{width:30px;height:30px;background:radial-gradient(circle at 35% 35%,#fff,#dfe6f5 60%,#b9c4de);box-shadow:0 0 26px 6px rgba(200,215,255,.35)}
.ph::after{content:"";position:absolute;inset:0;background:var(--tint,transparent);mix-blend-mode:color}
#ph0{--tint:rgba(16,30,86,.62);filter:brightness(.5) saturate(.85)}
#ph1{--tint:rgba(70,80,160,.28);filter:brightness(.82) saturate(.95)}
#ph3{--tint:rgba(86,160,236,.5);filter:brightness(1.1) saturate(.9)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.42))}
.toprow{position:relative;display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0;font-size:12.5px;font-weight:600}
.live{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:3px 10px;border-radius:99px}
.live i{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.hrow{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 18px 20px}
.hinfo{display:flex;flex-direction:column;gap:3px;min-width:0}
.hinfo b{font-size:22px;font-weight:700}
.hinfo .tm{font-size:13.5px;opacity:.9}
.hinfo .hd{font-size:13px;opacity:.85;margin-top:4px}
.big{flex:none;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;font-size:52px;font-weight:700;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

.sel{display:flex;gap:10px;margin:18px 0 10px}
.dd{flex:1}
.dd>button{width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px;box-shadow:var(--shadow)}
.dd small{display:block;color:var(--mut);font-size:11.5px}
.dd b{font-size:15.5px}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov.open{display:block}
.ovin{max-width:560px;margin:0 auto;padding:16px}
.ovh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ovh b{font-size:19px}
.ovh button{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--card);font-size:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(var(--c),1fr)}
.grid button{position:relative;aspect-ratio:1;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.grid button b{font-size:var(--fs);font-weight:700;line-height:1.1}
.grid button em{font-style:normal;color:var(--mut);font-size:11.5px}
.grid button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.grid button.on em{color:rgba(255,255,255,.85)}
.grid button .nm{position:absolute;top:8px;inset-inline-start:8px;min-width:22px;height:22px;padding:0 5px;border-radius:99px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,transparent)}
.grid button.on .nm{color:#fff;background:rgba(255,255,255,.22)}
.grid button.td::after{content:"";position:absolute;top:8px;inset-inline-end:8px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.tdy{display:block;width:100%;margin:0 0 12px;padding:9px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--pri) 55%,transparent);background:color-mix(in srgb,var(--pri) 8%,transparent);color:var(--pri);font-weight:600;font-size:14px}
.date{text-align:center;color:var(--mut);font-size:13.5px;margin:6px 0 14px}
.date b{color:var(--ink);font-size:15px}

.sh{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.sh.now{border-color:var(--pri);box-shadow:0 0 0 2px color-mix(in srgb,var(--pri) 30%,transparent),var(--shadow)}
.ic{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tx{flex:1;min-width:0}
.tx h3{margin:0;font-size:15.5px;font-weight:600}
.tx p{margin:0;color:var(--mut);font-size:13px}
.tag{margin-inline-start:8px;font-size:11px;font-weight:600;background:var(--pri);color:#fff;padding:1px 8px;border-radius:99px;vertical-align:middle}
.g{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--gc);background:color-mix(in srgb,var(--gc) 14%,transparent);border:1px solid color-mix(in srgb,var(--gc) 40%,transparent)}
.g0{--gc:#2563eb}.g1{--gc:#0f9d6a}.g2{--gc:#d97706}.g3{--gc:#8b3fd1}.g4{--gc:#dc2f4b}
.sig{position:relative;text-align:center;margin:26px 0 6px;padding:14px 0;isolation:isolate}
.sig::before{content:"";position:absolute;left:50%;top:50%;width:260px;height:80px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 26%,transparent),transparent);z-index:-1;filter:blur(6px)}
.sig span{font-size:15px;font-weight:600;color:var(--acc);text-shadow:0 0 10px color-mix(in srgb,var(--acc) 55%,transparent),0 0 24px color-mix(in srgb,var(--acc) 30%,transparent)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:18px}
@media (prefers-reduced-motion:reduce){.stars i,.live i{animation:none}.orb{transition:none}}
</style>
</head>

var GM=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
var WD=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var P=[[1,2,3,4,-1],[0,1,2,3,4],[0,1,2,3,-1],[4,0,1,2,3],[4,0,1,2,-1],[3,4,0,1,2],[3,4,0,1,-1],[2,3,4,0,1],[2,3,4,0,-1],[1,2,3,4,0]];
var CI=[0,2,3];
var L=["أ","ب","ج","د","هـ"];
var SH=[
 {n:"الفترة الصباحية",t:"6 ص – 2 ظ",ic:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'},
 {n:"الفترة المسائية",t:"2 ظ – 10 م",ic:'<svg viewBox="0 0 24 24"><path d="M17 18a5 5 0 0 0-10 0M12 9V2M4.2 10.2l1.4 1.4M19.8 10.2l-1.4 1.4M1 18h2M21 18h2M3 22h18"/></svg>'},
 {n:"الفترة الليلية",t:"10 م – 6 ص",ic:'<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'}
];

var ST=[],c=S0;
ML.forEach(function(l){ST.push(c);c+=l*DAY});
var TOTAL=ML.reduce(function(a,b){return a+b},0);

function $(i){return document.getElementById(i)}
function p2(v){return(v<10?"0":"")+v}
function greg(t){var d=new Date(t);return d.getUTCDate()+" "+GM[d.getUTCMonth()]+" "+d.getUTCFullYear()+"م"}
function today(){var n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())}
function hij(t){
  var i=Math.round((t-S0)/DAY);
  if(i<0||i>=TOTAL)return null;
  var m=0;while(m<11&&t>=ST[m+1])m++;
  return{m:m,d:Math.round((t-ST[m])/DAY)+1};
}
function curShift(){
  var n=new Date(),h=n.getHours(),t0=today();
  return{s:h>=6&&h<14?0:h>=14&&h<22?1:2,t:h<6?t0-DAY:t0};
}
function selT(){return ST[st.m]+(st.d-1)*DAY}

var st={m:0,d:1},manual=false;
function syncToday(){var h=hij(today());if(h){st.m=h.m;st.d=h.d}}
syncToday();

/* ---------- الهيرو ---------- */
function hero(){
  var c=curShift(),i=Math.round((c.t-S0)/DAY),ok=i>=0&&i<TOTAL,t0=today(),h=hij(t0);
  $("hb").textContent=SH[c.s].n;
  $("ht").textContent=SH[c.s].t;
  $("hh").textContent=(h?h.d+" "+HM[h.m]+" 1448هـ · ":"")+greg(t0);
  $("hg").textContent=ok?L[P[i%10][CI[c.s]]]:"–";
}

/* ---------- البطاقات ---------- */
function cards(){
  var t=selT(),i=Math.round((t-S0)/DAY),row=P[i%10],c=curShift(),o="";
  SH.forEach(function(s,k){
    var now=t===c.t&&k===c.s,g=row[CI[k]];
    o+='<div class="sh'+(now?' now':'')+'"><div class="ic">'+s.ic+'</div><div class="tx"><h3>'+s.n+(now?'<span class="tag">الآن</span>':'')+'</h3><p>'+s.t+'</p></div><div class="g g'+g+'">'+L[g]+'</div></div>';
  });
  $("list").innerHTML=o;
  var d=new Date(t);
  $("dt").innerHTML="<b>"+WD[d.getUTCDay()]+" "+st.d+" "+HM[st.m]+" 1448هـ</b><br>"+greg(t);
  $("bm").textContent=(st.m+1)+" · "+HM[st.m];
  $("bd").textContent=st.d;
}
function all(){cards();if($("ov").classList.contains("open"))build()}

/* ---------- السماء ---------- */
function hx(h){return[1,3,5].map(function(i){return parseInt(h.substr(i,2),16)})}
function mix(a,b,f){var x=hx(a),y=hx(b);return"#"+[0,1,2].map(function(i){var v=Math.round(x[i]+(y[i]-x[i])*f);return(v<16?"0":"")+v.toString(16)}).join("")}
var SK=[["#0a1230","#1b2a57"],["#4a5a94","#f2a36b"],["#2f8fd8","#a5dcf7"],["#3b7fc4","#f2b36b"],["#5b4b8c","#f08b5b"]],DK=[1,.5,0,.15,.6];
var CITY={name:"الرياض",lat:24.71,lon:46.68}; /* غيّر الإحداثيات لمدينتك: تتحكم بأوقات الشروق والغروب وتبديل الصور */
function sunT(n){
  var N=Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(n.getFullYear(),0,0))/DAY),r=Math.PI/180,lat=CITY.lat*r,
  dec=.4093*Math.sin(2*Math.PI*(284+N)/365),
  cc=(Math.sin(-.833*r)-Math.sin(lat)*Math.sin(dec))/(Math.cos(lat)*Math.cos(dec)),
  ha=Math.acos(Math.max(-1,Math.min(1,cc)))*12/Math.PI,
  B=2*Math.PI*(N-81)/364,eot=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B),
  noon=12+(45-CITY.lon)/15-eot/60;
  return[(noon-ha)*60,(noon+ha)*60];
}
function sky(){
  var n=new Date(),t=n.getHours()*60+n.getMinutes()+n.getSeconds()/60,a=sunT(n),sr=a[0],ss=a[1];
  var K=[[sr-60,0],[sr,1],[sr+75,2],[ss-90,2],[ss-45,3],[ss+10,4],[ss+70,0]],top,bot,dark;
  if(t<K[0][0]||t>=K[6][0]){top=SK[0][0];bot=SK[0][1];dark=1}
  else{
    var i=0;while(t>=K[i+1][0])i++;
    var f=(t-K[i][0])/(K[i+1][0]-K[i][0]),A=K[i][1],B=K[i+1][1];
    top=mix(SK[A][0],SK[B][0],f);bot=mix(SK[A][1],SK[B][1],f);dark=DK[A]+(DK[B]-DK[A])*f;
  }
  setPhotos(t,sr,ss);
  $("sky").style.background="linear-gradient(180deg,"+top+","+bot+")";
  $("stars").style.opacity=Math.max(0,Math.min(1,(dark-.2)/.8)).toFixed(2);
  var orb=$("orb"),isDay=t>=sr&&t<=ss,fr;
  if(isDay){fr=(t-sr)/(ss-sr);orb.className="orb sun"}
  else{var nl=1440-(ss-sr),tt=t>ss?t-ss:t+1440-ss;fr=Math.max(0,Math.min(1,tt/nl));orb.className="orb moon"}
  orb.style.left=(88-76*fr).toFixed(1)+"%";
  orb.style.top=(68-50*Math.sin(Math.PI*fr)).toFixed(1)+"%";
}
(function(){
  var o="",i,x,y,d,w;
  for(i=0;i<36;i++){x=(i*37.7)%100;y=(i*23.3)%65;d=(i%7)*.43;w=i%5===0?3:2;
    o+='<i style="left:'+x.toFixed(1)+'%;top:'+y.toFixed(1)+'%;width:'+w+'px;height:'+w+'px;animation-delay:-'+d.toFixed(2)+'s"></i>'}
  $("stars").innerHTML=o;
})();


/* ---------- الصور (تُحمَّل بعد ظهور الصفحة) ---------- */
var PH=[0,1,2,3].map(function(i){return $("ph"+i)}),phReady=0,phOn=false;
/* 0 ليل · 1 شفق · 2 غروب · 3 نهار */
function setPhotos(t,sr,ss){
  if(!phOn)return;
  var K=[[sr-60,0],[sr,1],[sr+75,3],[ss-90,3],[ss-45,2],[ss+10,1],[ss+70,0]],w=[0,0,0,0];
  if(t<K[0][0]||t>=K[6][0])w[0]=1;
  else{var i=0;while(t>=K[i+1][0])i++;var f=(t-K[i][0])/(K[i+1][0]-K[i][0]);w[K[i][1]]+=1-f;w[K[i+1][1]]+=f}
  PH.forEach(function(e,k){e.style.opacity=w[k].toFixed(3)});
}
window.__loadPhotos=function(arr){
  arr.forEach(function(u,k){
    var im=new Image();
    im.onload=function(){
      PH[k].style.backgroundImage="url("+u+")";
      if(++phReady===arr.length){phOn=true;$("hr").classList.add("ph-on");lastSky=0;sky()}
    };
    im.src=u;
  });
};

/* ---------- التحديث ---------- */
var lastKey="",lastSky=0;
function tick(force){
  var n=new Date();
  $("ck").textContent=p2(n.getHours())+":"+p2(n.getMinutes())+":"+p2(n.getSeconds());
  var cs=curShift(),key=today()+"|"+cs.s;
  if(force||key!==lastKey){
    lastKey=key;
    if(!manual)syncToday();
    hero();all();
  }
  if(force||Date.now()-lastSky>20000){lastSky=Date.now();sky()}
}
function refresh(){tick(true)}

tick(true);
setInterval(tick,1000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)refresh()});
window.addEventListener("pageshow",refresh);
window.addEventListener("focus",refresh);
window.addEventListener("online",refresh);
window.addEventListener("resize",function(){if($("ov").classList.contains("open"))build()});

/* ---------- التفاعل ---------- */
var mode="";
function fit(n,list){
  var W=Math.min(560,window.innerWidth)-32,A=window.innerHeight-96,c=list[list.length-1],i,w,r;
  for(i=0;i<list.length;i++){w=(W-(list[i]-1)*10)/list[i];r=Math.ceil(n/list[i]);if(r*w+(r-1)*10<=A){c=list[i];break}}
  return{c:c,w:(W-(c-1)*10)/c};
}
function build(){
  var o="",th=hij(today()),g=$("gr");
  if(mode==="m"){
    $("ovt").textContent="اختر الشهر";
    var f=fit(12,[2,3,4]);g.style.setProperty("--c",f.c);g.style.setProperty("--fs",Math.round(f.w*.17)+"px");
    HM.forEach(function(n,m){o+='<button type="button" data-m="'+m+'" class="'+(m===st.m?"on ":"")+(th&&th.m===m?"td":"")+'"><span class="nm">'+(m+1)+'</span><b>'+n+'</b><em>'+GM[new Date(ST[m]).getUTCMonth()]+'</em></button>'});
  }else{
    $("ovt").textContent="اختر اليوم · "+(st.m+1)+" "+HM[st.m];
    var f=fit(ML[st.m],[4,5,6,7]);g.style.setProperty("--c",f.c);g.style.setProperty("--fs",Math.round(f.w*.34)+"px");
    for(var d=1;d<=ML[st.m];d++){o+='<button type="button" data-d="'+d+'" class="'+(d===st.d?"on ":"")+(th&&th.m===st.m&&th.d===d?"td":"")+'"><b>'+d+'</b><em>'+WD[new Date(ST[st.m]+(d-1)*DAY).getUTCDay()]+'</em></button>'}
  }
  g.innerHTML=o;
}
function openOv(m){mode=m;build();$("ov").classList.add("open");$("ov").scrollTop=0;document.body.style.overflow="hidden"}
function closeOv(){$("ov").classList.remove("open");document.body.style.overflow=""}
$("bmb").addEventListener("click",function(){openOv("m")});
$("bdb").addEventListener("click",function(){openOv("d")});
$("ovx").addEventListener("click",closeOv);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeOv()});
$("gr").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  manual=true;
  if(mode==="m"){st.m=+b.dataset.m;if(st.d>ML[st.m])st.d=ML[st.m];cards();closeOv()}
  else{st.d=+b.dataset.d;cards();closeOv()}
});
$("tdy").addEventListener("click",function(){manual=false;syncToday();cards()});
})();
</script>
